name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the versions and CHANGELOG.md
        run: node scripts/release-preflight.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Use npm 11, which has Trusted Publishing
        run: npm install -g npm@11
      - name: Publish the npm packages through Trusted Publishing
        run: node scripts/npm-publish.mjs
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat "$RUNNER_TEMP/release/release-title.txt")"
          notes="$RUNNER_TEMP/release/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes" --verify-tag
          fi
